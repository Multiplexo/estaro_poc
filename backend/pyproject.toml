[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "felix", email = "felixjungensbluth@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery-types>=0.26.0",
    "celery[redis]>=5.6,<6",
    "docling>=2.145.0",
    "fastapi[standard]>=0.162.0",
    "kombu>=5.6.2",
    "langchain>=1.4.7",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.7.3",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "minio>=7.2.20",
    "openai>=3.41.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlmodel>=0.0.48",
    "structlog>=26.1.0",
    "urllib3>=2.8.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pyright]
include = ["app"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
