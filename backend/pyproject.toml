[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "felix", email = "felixjungensbluth@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "authlib>=1.9.4,<2",
    "beautifulsoup4>=4.12,<5",
    "celery-types>=0.26.0",
    "celery[redis]>=5.6,<6",
    "cryptography>=46",
    "docling>=2.145.0",
    "extract-msg>=0.55,<1",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "kombu>=5.6.2",
    "langchain>=1.4.7",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.7.3",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "microsoft-kiota-abstractions>=1.16,<2",
    "microsoft-kiota-http>=1.16,<2",
    "microsoft-kiota-serialization-json>=1.16,<2",
    "minio>=7.2.20",
    "msgraph-core>=1.5.2,<2",
    "msgraph-sdk>=1.65,<2",
    "openai>=3.41.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlmodel>=0.0.48",
    "structlog>=26.1.0",
    "tenacity>=9.1.2",
    "urllib3>=2.8.0",
    "uvicorn[standard]>=0.54.0",
    # Makes Docling pick RapidOCR with its bundled ONNX models instead of
    # downloading PyTorch OCR weights at runtime.
    "onnxruntime>=1.20",
    # Pulled in by docling; listed directly so Linux builds use CPU-only wheels.
    "torch>=2.15",
    "torchvision>=0.29",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: exercises multiple components; database tests require TEST_DATABASE_URL"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]
